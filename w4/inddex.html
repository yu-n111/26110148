<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友對我的悄悄話留言板</title>
    <!-- 引入 Google Fonts：極簡優雅的襯線體與無襯線體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. 視覺風格與變數設定 (極簡風配色與輪播參數)
           ========================================================================== */
        :root {
            /* 【配色設定】可在此自訂網頁的主要顏色 */
            --bg-color: #fafafa;             /* 全局背景色 (極簡淺灰白) */
            --card-bg: #ffffff;             /* 卡片背景色 */
            --text-primary: #111111;        /* 主要文字顏色 */
            --text-secondary: #757575;      /* 次要文字顏色 (作者/時間) */
            --border-color: #eaeaea;        /* 普通卡片邊框顏色 */
            
            /* 【輪播焦點配色設定】當卡片被選中時發光的顏色 */
            --highlight-border: #111111;    /* 焦點卡片邊框顏色 */
            --highlight-shadow: rgba(0, 0, 0, 0.15); /* 焦點卡片陰影顏色 */
            
            /* 【字體設定】 */
            --font-serif: 'Noto Serif TC', serif;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            
            /* 【動畫過渡速度】控制卡片放大/變暗的滑順程度 */
            --transition-speed: 0.6s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-serif);
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }

        /* ==========================================================================
           2. 頁面標頭 (Header)
           ========================================================================== */
        header {
            text-align: center;
            max-width: 600px;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        header p {
            font-family: var(--font-sans);
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ==========================================================================
           3. 讀取中動畫 (Loading Animation)
           ========================================================================== */
        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 0;
            gap: 20px;
        }

        /* 旋轉微型圓環 */
        .spinner {
            width: 36px;
            height: 36px;
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--text-primary);
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        }

        .loading-text {
            font-family: var(--font-sans);
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            animation: pulse 1.5s ease-in-out infinite alternate;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* ==========================================================================
           4. 瀑布流排版 (Masonry Layout)
           ========================================================================== */
        .masonry-container {
            width: 100%;
            max-width: 1200px;
            column-count: 4;           /* 預設 4 欄 */
            column-gap: 24px;          /* 欄位間距 */
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .masonry-container.visible {
            opacity: 1;
        }

        /* 響應式斷點：自動調整欄數 */
        @media (max-width: 1100px) { .masonry-container { column-count: 3; } }
        @media (max-width: 768px)  { .masonry-container { column-count: 2; body { padding: 40px 16px; } } }
        @media (max-width: 480px)  { .masonry-container { column-count: 1; } }

        /* ==========================================================================
           5. 留言卡片樣式與焦點 (Highlight) 特效
           ========================================================================== */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 28px 24px;
            margin-bottom: 24px;
            break-inside: avoid;       /* 關鍵：防止卡片被欄位截斷 */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            position: relative;
            
            /* 平滑過渡動畫，確保放大與變暗特效滑順 */
            transition: transform var(--transition-speed) ease,
                        box-shadow var(--transition-speed) ease,
                        border-color var(--transition-speed) ease,
                        opacity var(--transition-speed) ease,
                        filter var(--transition-speed) ease;
        }

        .card-content {
            font-size: 0.98rem;
            color: var(--text-primary);
            white-space: pre-wrap;    /* 保留原留言的換行 */
            word-break: break-word;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f5f5f5;
            padding-top: 14px;
            font-family: var(--font-sans);
        }

        .card-author {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }

        .card-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.6;
        }

        /* ---【焦點發光特效 (Highlight Class)】--- */
        .card.highlight {
            transform: scale(1.06);     /* 卡片放大 6% */
            z-index: 10;                 /* 提升層級，確保不被鄰近卡片遮擋 */
            border-color: var(--highlight-border);
            box-shadow: 0 12px 35px var(--highlight-shadow);
            opacity: 1 !important;
            filter: blur(0px) !important;
        }

        /* ---【未選中卡片微暗特效 (Dimmed Class)】--- */
        .card.dimmed {
            opacity: 0.45;               /* 未選中的卡片降低透明度 */
            filter: blur(0.8px);         /* 稍微套用模糊，突出焦點卡片 */
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- 頁面標題 -->
    <header>
        <h1>悄悄話留言板</h1>
        <p>Words from friends</p>
    </header>

    <!-- 載入中動畫區塊 -->
    <div id="loading">
        <div class="spinner"></div>
        <div class="loading-text">讀取留言中...</div>
    </div>

    <!-- 瀑布流留言牆容器 -->
    <main class="masonry-container" id="masonryContainer"></main>

    <script>
        // ==========================================================================
        //  設定區域 (可依需求自行修改參數)
        // ==========================================================================
        
        // 1. Google 試算表發佈的 CSV 網址 (已去除結尾多餘的符號)
        const ORIGINAL_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSV7K3Zo560pHeou6_UbC6WQLtWVeowhkOfqvmyUz0sysB81_frZAElCDQY9B2Y2g_RLMlAtSjsG_Uv/pub?output=csv';

        // 2. 【輪播時間設定】單位為毫秒 (ms)。例如：3000 代表 3 秒鐘切換一次焦點卡片
        const ROTATE_INTERVAL_MS = 3000; 

        // 全局變數
        let cardsArray = [];      // 儲存所有卡片 DOM 元素的陣列
        let currentIndex = 0;     // 目前亮起特效的卡片索引
        let rotateTimer = null;   // 計時器物件

        // ==========================================================================
        //  健壯的 CSV 解析邏輯 (能妥善處理留言內的逗號、雙引號與換行)
        // ==========================================================================
        function parseCSV(text) {
            const result = [];
            let row = [];
            let field = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (inQuotes) {
                    if (char === '"' && nextChar === '"') {
                        field += '"';
                        i++; // 跳過雙引號轉義
                    } else if (char === '"') {
                        inQuotes = false;
                    } else {
                        field += char;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                    } else if (char === ',') {
                        row.push(field.trim());
                        field = '';
                    } else if (char === '\n' || (char === '\r' && nextChar === '\n')) {
                        row.push(field.trim());
                        if (row.some(f => f.length > 0)) {
                            result.push(row);
                        }
                        row = [];
                        field = '';
                        if (char === '\r') i++;
                    } else {
                        field += char;
                    }
                }
            }

            if (field.length > 0 || row.length > 0) {
                row.push(field.trim());
                result.push(row);
            }

            return result;
        }

        // 時間格式化工具
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return dateStr;
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}.${mm}.${dd}`;
        }

        // HTML 安全轉義 (防止 XSS 注入)
        function escapeHTML(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#032;");
        }

        // ==========================================================================
        //  主要資料串接與卡片生成邏輯
        // ==========================================================================
        async function fetchMessages() {
            const loadingEl = document.getElementById('loading');
            const containerEl = document.getElementById('masonryContainer');

            try {
                let response;
                try {
                    // 優先直接讀取 CSV
                    response = await fetch(ORIGINAL_CSV_URL);
                    if (!response.ok) throw new Error(`HTTP 錯誤碼: ${response.status}`);
                } catch (directError) {
                    console.warn('直接讀取失敗，自動啟動 CORS Proxy 代理...', directError);
                    // 備用方案：透過代理伺服器繞過 CORS 存取限制
                    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(ORIGINAL_CSV_URL);
                    response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error(`Proxy HTTP 錯誤碼: ${response.status}`);
                }

                const csvText = await response.text();
                const rows = parseCSV(csvText);
                
                // 跳過 CSV 標題列 (時間戳記, 名字, 悄悄話)
                const dataRows = rows.slice(1);

                // 隱藏讀取動畫
                loadingEl.style.display = 'none';

                if (dataRows.length === 0) {
                    containerEl.innerHTML = '<p style="text-align:center; width:100%; color: var(--text-secondary);">目前試算表中還沒有留言喔！</p>';
                    containerEl.classList.add('visible');
                    return;
                }

                // 倒序排列：將最新留言放在最前頁
                dataRows.reverse();

                // 動態創建卡片
                dataRows.forEach(row => {
                    const timestamp = row[0] ? formatDate(row[0]) : '';
                    const name = row[1] || '匿名朋友';
                    const message = row[2] || '';

                    if (!message) return; // 跳過空留言

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-content">${escapeHTML(message)}</div>
                        <div class="card-footer">
                            <span class="card-author">${escapeHTML(name)}</span>
                            <span class="card-time">${escapeHTML(timestamp)}</span>
                        </div>
                    `;

                    containerEl.appendChild(card);
                    cardsArray.push(card); // 存入陣列供後續輪播控制
                });

                // 平滑顯示留言牆
                containerEl.classList.add('visible');

                // 畫面載入 완성後，發動卡片輪播動畫
                if (cardsArray.length > 0) {
                    startHighlightCarousel();
                }

            } catch (error) {
                console.error('讀取 CSV 失敗：', error);
                loadingEl.innerHTML = `
                    <div class="loading-text" style="color: #d9534f; text-align: center;">
                        資料載入失敗！<br>
                        <small style="font-size: 0.8rem; color: #777;">細節：${escapeHTML(error.message)}</small><br><br>
                        請確認試算表已「發佈到網路」並設定為 CSV 格式。
                    </div>
                `;
            }
        }

        // ==========================================================================
        //  隨時間輪播亮起 (Highlight Carousel) 特效核心邏輯
        // ==========================================================================
        function startHighlightCarousel() {
            // 先立即觸發一次第 0 張卡片的亮起特效
            updateCardHighlights();

            // 設定計時器：每隔指定時間 (如 3 秒) 自動切換下一張
            rotateTimer = setInterval(() => {
                currentIndex = (currentIndex + 1) % cardsArray.length; // 循環索引
                updateCardHighlights();
            }, ROTATE_INTERVAL_MS);
        }

        // 更新所有卡片的狀態 (1張亮起，其餘變暗)
        function updateCardHighlights() {
            cardsArray.forEach((card, index) => {
                if (index === currentIndex) {
                    // 當前目標卡片：套用放大亮起樣式，並移除變暗樣式
                    card.classList.add('highlight');
                    card.classList.remove('dimmed');
                } else {
                    // 其餘卡片：套用變暗樣式，並移除亮起樣式
                    card.classList.remove('highlight');
                    card.classList.add('dimmed');
                }
            });
        }

        // 頁面載入完成後啟動主程序
        document.addEventListener('DOMContentLoaded', fetchMessages);
    </script>
</body>
</html>
